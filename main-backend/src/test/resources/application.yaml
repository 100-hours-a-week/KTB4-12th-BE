# 테스트에서는 목 데이터를 제외하고 스키마 마이그레이션만 적용한다.
# 메인 application.yaml을 그대로 유지하면서 flyway.locations만 오버라이드한다.
# (src/test/resources의 application.yaml은 메인 파일을 파일 단위로 대체하므로
#  datasource 등 나머지 설정도 모두 여기에 있어야 한다.)
spring:
  application:
    name: gift

  # datasource는 MySqlTestContainerInitializer가 Testcontainers MySQL 값으로 주입한다.
  datasource:
    hikari:
      # 여러 Spring TestContext가 각자 Pool을 생성해도
      # Testcontainers MySQL의 연결 한도를 소진하지 않도록 제한한다.
      maximum-pool-size: 4
      minimum-idle: 0
      data-source-properties:
        useAffectedRows: true
        compensateOnDuplicateKeyUpdateCounts: false

  jpa:
    hibernate:
      # 스키마 변경은 Flyway가 담당하고 Hibernate는 검증만 수행한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이미 테이블이 존재하는 기존 로컬 DB에서도 Flyway를 도입할 수 있도록 기준선을 0으로 둔다.
    # V1은 IF NOT EXISTS라 기존 테이블이 있어도 그대로 적용되고, 새 DB에서는 전체 스키마가 생성된다.
    baseline-on-migrate: true
    baseline-version: 0

storage:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${PRODUCT_IMAGE_BUCKET:test-product-image-bucket}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.gift.gift: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"

app:
  scheduling:
    enabled: false

  ai-profile:
    base-url: http://localhost:18080
    service-token: test-profiling-token
    connect-timeout: 1s
    read-timeout: 1s
    quiet-period: 1h
    maximum-window: 6h
    batch-size: 100
    recovery-batch-size: 50
    dispatch-interval: 1h

sentry:
  dsn: ""
  environment: test
