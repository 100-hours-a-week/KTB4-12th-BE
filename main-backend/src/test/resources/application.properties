app.security.jwt.secret-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.security.jwt.issuer=https://test-issuer.example
app.security.cors.allowed-origins=http://localhost:3000
app.security.login-rate-limit.hmac-secret-base64=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

app.ai-profile.base-url=http://localhost:18080
app.ai-profile.service-token=test-profiling-token
app.ai-profile.connect-timeout=1s
app.ai-profile.read-timeout=1s
app.ai-profile.quiet-period=1h
app.ai-profile.maximum-window=6h
app.ai-profile.batch-size=100
app.ai-profile.dispatch-interval=1h

app.scheduling.enabled=false

# 여러 Spring TestContext의 Hikari Pool이 MySQL 연결 한도를 소진하지 않게 한다.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0

# 테스트 전용 값이며 운영 설정으로 사용하지 않는다.
app.ai-chat.conversation-token.secret-base64=AQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.ai-chat.conversation-token.issuer=https://test-chat-issuer.example
app.ai-chat.client.base-url=http://ai.test/v1/chat/conversations
app.ai-chat.client.service-token=stub-service-token
app.ai-chat.client.connect-timeout=1s
app.ai-chat.client.read-timeout=2s
