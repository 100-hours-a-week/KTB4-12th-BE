spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:}
    password: ${SPRING_RABBITMQ_PASSWORD:}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:gift}
    connection-timeout: 3s
    requested-heartbeat: 20s
    publisher-confirm-type: correlated
    publisher-returns: true
    dynamic: false

  application:
    name: gift

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        useAffectedRows: true
        compensateOnDuplicateKeyUpdateCounts: false

  jpa:
    open-in-view: false
    hibernate:
      # 스키마 변경은 Flyway가 담당하고 Hibernate는 검증만 수행한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    # 이미 테이블이 존재하는 기존 로컬 DB에서도 Flyway를 도입할 수 있도록 기준선을 0으로 둔다.
    # V1은 IF NOT EXISTS라 기존 테이블이 있어도 그대로 적용되고, 새 DB에서는 전체 스키마가 생성된다.
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:9201}
    connection-timeout: 3s
    socket-timeout: 10s

  data:
    elasticsearch:
      repositories:
        enabled: false

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:3000}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}

storage:
  s3:
    region: ${AWS_REGION}
    bucket: ${PRODUCT_IMAGE_BUCKET}

app:
  rabbitmq:
    management:
      url: ${RABBITMQ_MANAGEMENT_URL:}
      username: ${RABBITMQ_MANAGEMENT_USERNAME:}
      password: ${RABBITMQ_MANAGEMENT_PASSWORD:}
  report:
    sheets:
      enabled: ${REPORT_SHEETS_CONSUMER_ENABLED:false}
    discord:
      enabled: ${REPORT_DISCORD_CONSUMER_ENABLED:false}
    mq:
      enabled: ${REPORT_MQ_ENABLED:false}
      batch-size: ${REPORT_MQ_BATCH_SIZE:10}
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    search-relay-enabled: ${OUTBOX_SEARCH_RELAY_ENABLED:true}
    rabbit:
      exchange: ${OUTBOX_RABBIT_EXCHANGE:}
      search-routing-key: ${OUTBOX_SEARCH_ROUTING_KEY:}
    search-batch-size: ${OUTBOX_SEARCH_BATCH_SIZE:10}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    cleanup-interval-ms: ${OUTBOX_CLEANUP_INTERVAL_MS:3600000}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:60}
    max-failures: ${OUTBOX_MAX_FAILURES:10}
    retry-base-seconds: ${OUTBOX_RETRY_BASE_SECONDS:2}
    retry-max-seconds: ${OUTBOX_RETRY_MAX_SECONDS:300}
  redis:
    auth:
      host: ${REDIS_AUTH_HOST:${REDIS_HOST:localhost}}
      port: ${REDIS_AUTH_PORT:${REDIS_PORT:6379}}
      password: ${REDIS_AUTH_PASSWORD:${REDIS_PASSWORD:}}
      connect-timeout: ${REDIS_AUTH_CONNECT_TIMEOUT:2s}
      command-timeout: ${REDIS_AUTH_COMMAND_TIMEOUT:2s}
      sentinel:
        enabled: ${REDIS_AUTH_SENTINEL_ENABLED:false}
        master: ${REDIS_AUTH_SENTINEL_MASTER:}
        nodes: ${REDIS_AUTH_SENTINEL_NODES:}
        password: ${REDIS_AUTH_SENTINEL_PASSWORD:}

    product:
      host: ${REDIS_PRODUCT_HOST:${REDIS_HOST:localhost}}
      port: ${REDIS_PRODUCT_PORT:${REDIS_PORT:6379}}
      password: ${REDIS_PRODUCT_PASSWORD:${REDIS_PASSWORD:}}
      connect-timeout: ${REDIS_PRODUCT_CONNECT_TIMEOUT:2s}
      command-timeout: ${REDIS_PRODUCT_COMMAND_TIMEOUT:2s}
      sentinel:
        enabled: ${REDIS_PRODUCT_SENTINEL_ENABLED:false}
        master: ${REDIS_PRODUCT_SENTINEL_MASTER:}
        nodes: ${REDIS_PRODUCT_SENTINEL_NODES:}
        password: ${REDIS_PRODUCT_SENTINEL_PASSWORD:}
      ai-recommended-cache:
        ttl: 30m

      detail-cache:
        ttl: ${PRODUCT_DETAIL_CACHE_TTL:2h}

  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  email:
    from-address: ${SMTP_FROM_ADDRESS:no-reply@seonjalal.com}

  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: ${JWT_ISSUER}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    login-rate-limit:
      hmac-secret-base64: ${LOGIN_RATE_LIMIT_HMAC_SECRET_BASE64}

  product-search:
    enabled: ${PRODUCT_SEARCH_ENABLED:false}
    index-name: ${PRODUCT_SEARCH_INDEX:gift-products-local-v1}

    outbox:
      enabled: ${PRODUCT_SEARCH_OUTBOX_ENABLED:false}

    sync:
      enabled: ${PRODUCT_SEARCH_SYNC_ENABLED:false}
      poll-interval-ms: ${PRODUCT_SEARCH_SYNC_POLL_INTERVAL_MS:5000}
      batch-size: ${PRODUCT_SEARCH_SYNC_BATCH_SIZE:100}
      lease-seconds: ${PRODUCT_SEARCH_SYNC_LEASE_SECONDS:60}
      max-failures: ${PRODUCT_SEARCH_SYNC_MAX_FAILURES:10}
      retry-base-seconds: ${PRODUCT_SEARCH_SYNC_RETRY_BASE_SECONDS:2}
      retry-max-seconds: ${PRODUCT_SEARCH_SYNC_RETRY_MAX_SECONDS:300}

  ai-chat:
    client:
      base-url: ${AI_CHAT_BASE_URL}
      service-token: ${AI_CHAT_SERVICE_TOKEN}
      connect-timeout: ${AI_CHAT_CONNECT_TIMEOUT}
      read-timeout: ${AI_CHAT_READ_TIMEOUT}

    conversation-token:
      secret-base64: ${CHAT_CONVERSATION_TOKEN_SECRET_BASE64}
      issuer: ${CHAT_CONVERSATION_TOKEN_ISSUER}

    sse:
      idle-timeout: ${AI_CHAT_SSE_IDLE_TIMEOUT}
      total-timeout: ${AI_CHAT_SSE_TOTAL_TIMEOUT}
      max-connections: ${AI_CHAT_SSE_MAX_CONNECTIONS}

  ai-profile:
    result-consumer:
      enabled:
        ${AI_PROFILE_RESULT_CONSUMER_ENABLED:false}
    cleanup-enabled: ${AI_PROFILE_CLEANUP_ENABLED:false}
    scheduling-enabled: ${AI_PROFILE_SCHEDULING_ENABLED:false}
    base-url: ${AI_PROFILE_BASE_URL}
    service-token: ${PROFILING_SERVICE_TOKEN}
    connect-timeout: ${AI_PROFILE_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_PROFILE_READ_TIMEOUT:10s}
    quiet-period: 60s
    maximum-window: 300s
    batch-size: ${AI_PROFILE_BATCH_SIZE:100}
    dispatch-interval: ${AI_PROFILE_DISPATCH_INTERVAL:1m}
    amqp:
      enabled: ${AI_PROFILE_AMQP_ENABLED:false}

      confirm-timeout-seconds: 30

      initial-group-size: ${AI_PROFILE_QUORUM_INITIAL_GROUP_SIZE:1}

  payment:
    mq:
      enabled: ${APP_PAYMENT_MQ_ENABLED:false}
      topology:
        enabled: ${PAYMENT_MQ_TOPOLOGY_ENABLED:false}
      consumer:
        receipt:
          enabled: ${APP_PAYMENT_MQ_CONSUMER_RECEIPT_ENABLED:false}
          concurrency: ${APP_PAYMENT_MQ_CONSUMER_RECEIPT_CONCURRENCY:1}
          prefetch: ${APP_PAYMENT_MQ_CONSUMER_RECEIPT_PREFETCH:1}
        roulette:
          concurrency: ${APP_PAYMENT_MQ_CONSUMER_ROULETTE_CONCURRENCY:1}
          prefetch: ${APP_PAYMENT_MQ_CONSUMER_ROULETTE_PREFETCH:1}
        coupon-restore:
          concurrency: ${APP_PAYMENT_MQ_CONSUMER_COUPON_RESTORE_CONCURRENCY:1}
          prefetch: ${APP_PAYMENT_MQ_CONSUMER_COUPON_RESTORE_PREFETCH:1}
        recovery:
          concurrency: ${APP_PAYMENT_MQ_CONSUMER_RECOVERY_CONCURRENCY:1}
          prefetch: ${APP_PAYMENT_MQ_CONSUMER_RECOVERY_PREFETCH:1}
    recovery:
      dispatch:
        enabled: ${PAYMENT_RECOVERY_DISPATCH_ENABLED:false}
        batch-size: ${PAYMENT_RECOVERY_DISPATCH_BATCH_SIZE:100}
        lease-seconds: ${PAYMENT_RECOVERY_DISPATCH_LEASE_SECONDS:60}
        poll-interval-ms: ${PAYMENT_RECOVERY_DISPATCH_POLL_INTERVAL_MS:5000}
    client:
      base-url: ${PAYMENT_SERVER_BASE_URL}
      api-key: ${PAYMENT_SERVER_API_KEY}
      connect-timeout: ${PAYMENT_CONNECT_TIMEOUT:1s}
      command-timeout: ${PAYMENT_COMMAND_TIMEOUT:3s}
      query-timeout: ${PAYMENT_QUERY_TIMEOUT:2s}
    reconciliation:
      interval: ${PAYMENT_RECONCILIATION_INTERVAL:1m}
      batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:100}
      stale-age: ${PAYMENT_RECONCILIATION_STALE_AGE:1m}
      timeout: ${PAYMENT_RECONCILIATION_TIMEOUT:10m}

  notification:
    common-outbox:
      enabled: ${NOTIFICATION_COMMON_OUTBOX_ENABLED:false}

  bug-report:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    google-sheets:
      credentials-json-base64: ${GOOGLE_SERVICE_ACCOUNT_JSON_BASE64:}
      spreadsheet-id: ${GOOGLE_SHEET_ID:}
      sheet-name: ${GOOGLE_SHEET_TAB:}

management:
  health:
    # 활성화 OR 조건은 RabbitConnectionConfiguration에서 관리한다.
    rabbit:
      enabled: false
    elasticsearch:
      enabled: ${app.product-search.enabled:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.gift.gift: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%thread] [traceId=%X{traceId:-}] %logger{36} - %msg%n"

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: ${SENTRY_SEND_DEFAULT_PII:false}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
