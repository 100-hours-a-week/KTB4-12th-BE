name: gift-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - ./monitoring/runtime.tmp/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/runtime.tmp/monitoring-password:/etc/prometheus/monitoring-password:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      PROMETHEUS_SCRAPE_INTERVAL: ${PROMETHEUS_SCRAPE_INTERVAL:-15s}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    command:
      - --config.my-cnf=/etc/mysql/exporter.cnf
      - --no-collect.slave_status
      - --exporter.max_open_connections=2
    volumes:
      - ./monitoring/runtime.tmp/exporter.cnf:/etc/mysql/exporter.cnf:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [monitoring]
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    # Linux host/cgroup access is required; Docker Desktop exposes its Linux VM, not macOS.
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,resctrl,advtcp,memory_numa
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitoring]
    restart: unless-stopped

networks:
  monitoring:
    name: ${MONITORING_NETWORK:-gift-monitoring}

volumes:
  prometheus-data:
  grafana-data:
