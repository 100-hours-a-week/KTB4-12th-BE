# Initial thresholds; validate against observed workload before production use.
groups:
  - name: profiling-publish
    rules:
      - alert: ProfilingPublishBlocked
        expr: max(profiling_publish_jobs{publish_status="BLOCKED"}) > 0
        for: 1m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling jobs require manual recovery"
      - alert: ProfilingPublishBacklog
        expr: max(profiling_publish_oldest_age_seconds) > 300
        for: 2m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Unpublished profiling job is older than five minutes"
      - alert: ProfilingMetricsStale
        expr: profiling_publish_db_sample_ok == 0 or profiling_publish_db_sample_age_seconds > 180
        for: 2m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling DB metrics are unavailable or stale"
      - alert: ProfilingMetricsMissing
        expr: absent(profiling_publish_db_sample_ok)
        for: 2m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling metrics are missing; check feature flags and scraping"
      - alert: ProfilingPublishFailure
        expr: sum(increase(profiling_publish_outcomes_total{code!~"ACK_NO_RETURN|NOT_SENT"}[5m])) > 0
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling publish failed; inspect error-code metrics and logs"
      - alert: ProfilingPublishDbRecordFailure
        expr: sum(increase(profiling_publish_db_record_errors_total[5m])) > 0
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Broker outcome could not be recorded in the DB"
      - alert: ProfilingBrokerBlocked
        expr: profiling_publish_connection_blocked == 1
        for: 1m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling publisher connection is blocked"
      - alert: ProfilingRabbitReadyBacklog
        expr: max by (environment, cluster, vhost, queue) (rabbitmq_detailed_queue_messages_ready{job="rabbitmq-queues",queue="profiling.request"}) > 550
        for: 2m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling request Ready backlog exceeds initial threshold"
      - alert: ProfilingResultReadyBacklog
        # Initial investigation threshold, not an AI completion deadline.
        expr: max by (environment, cluster, vhost, queue) (rabbitmq_detailed_queue_messages_ready{job="rabbitmq-queues",queue="profiling.result"}) > 550
        for: 2m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling result Ready backlog exceeds initial threshold"
          description: "Inspect BE result processing and DB health; do not republish requests solely due to delay."
      - alert: ProfilingQueueWithoutConsumers
        expr: |
          (max by (environment, cluster, vhost, queue) (rabbitmq_detailed_queue_messages_ready{job="rabbitmq-queues",queue=~"profiling[.](request|result)"}) > 0)
          and on (environment, cluster, vhost, queue)
          (max by (environment, cluster, vhost, queue) (rabbitmq_detailed_queue_consumers{job="rabbitmq-queues",queue=~"profiling[.](request|result)"}) == 0)
        for: 2m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling queue has waiting messages but no consumers"
          description: "Request queue: inspect AI. Result queue: inspect BE. Check feature flags and manual stops; silence planned maintenance. This is not an automatic resume trigger."
      - alert: ProfilingDeadLetterBacklog
        expr: max by (environment, cluster, vhost, queue) (rabbitmq_detailed_queue_messages_ready{job="rabbitmq-queues",queue=~"profiling[.](request|result)[.]failed"}) > 0
        for: 1m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling dead-letter queue contains messages"
          description: "Investigate the failed message and recover using the runbook; do not discard or automatically replay it."
      - alert: ProfilingRabbitMemoryPressure
        expr: rabbitmq_process_resident_memory_bytes / rabbitmq_resident_memory_limit_bytes > 0.9
        for: 1m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "RabbitMQ memory approaches its configured high watermark"
      - alert: ProfilingRabbitDiskPressure
        expr: rabbitmq_disk_space_available_bytes < rabbitmq_disk_space_available_limit_bytes
        for: 1m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "RabbitMQ disk space is below its configured low watermark"
      - alert: ProfilingMonitoringTargetDown
        expr: up{job=~"spring|rabbitmq|rabbitmq-queues"} == 0
        for: 1m
        labels: {severity: warning, component: profiling}
        annotations:
          summary: "Profiling monitoring target cannot be scraped"
